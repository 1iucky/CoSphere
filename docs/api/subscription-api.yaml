              schema:
                $ref: '#/components/schemas/SuccessResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Token 认证

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: 资源 ID

    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: 页码

    PageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: 每页数量

  responses:
    Unauthorized:
      description: 未授权
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "未登录或 token 已过期"

    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "参数验证失败"

    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "资源不存在"

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "操作成功"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string

    # ==================== Subscription Plan Schemas ====================
    SubscriptionPlanRequest:
      type: object
      required:
        - name
        - price_cents
        - billing_cycle
      properties:
        sku:
          type: string
          maxLength: 64
          description: SKU 编码
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: 套餐名称
        description:
          type: string
          description: 套餐描述
        price_cents:
          type: integer
          minimum: 1
          description: 价格（分）
        currency:
          type: string
          minLength: 3
          maxLength: 3
          default: CNY
          description: 币种
        billing_cycle:
          type: string
          enum: [monthly, yearly, custom]
          description: 计费周期
        billing_cycle_value:
          type: integer
          minimum: 1
          description: 自定义计费周期值（天）
        allow_wallet_fallback:
          type: boolean
          default: true
          description: 是否允许钱包回退
        status:
          type: string
          enum: [draft, active, archived]
          default: draft
        start_at:
          type: integer
          description: 生效开始时间戳
        end_at:
          type: integer
          description: 生效结束时间戳
        model_whitelist:
          type: string
          description: 模型白名单（逗号分隔）
        channel_groups:
          type: string
          description: 渠道组（逗号分隔）
        extra:
          type: string
          description: 扩展信息（JSON）
        limits:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionPlanLimitRequest'
          description: 限额配置

    SubscriptionPlanLimitRequest:
      type: object
      required:
        - period
        - quota
      properties:
        period:
          type: string
          enum: [five_hours, day, week, month]
          description: 限额周期
        quota:
          type: integer
          minimum: 1
          description: 限额值
        unit:
          type: string
          enum: [quota, tokens, requests]
          default: quota
          description: 限额单位
        enabled:
          type: boolean
          default: true
        window_strategy:
          type: string
          enum: [rolling, fixed, natural]
          default: rolling
          description: 窗口策略

    SubscriptionPlanResponse:
      type: object
      properties:
        id:
          type: integer
        sku:
          type: string
        name:
          type: string
        description:
          type: string
        price_cents:
          type: integer
        currency:
          type: string
        billing_cycle:
          type: string
        billing_cycle_value:
          type: integer
        allow_wallet_fallback:
          type: boolean
        status:
          type: string
        start_at:
          type: integer
        end_at:
          type: integer
        model_whitelist:
          type: string
        channel_groups:
          type: string
        extra:
          type: string
        created_at:
          type: integer
        updated_at:
          type: integer
        limits:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionPlanLimitResponse'

    SubscriptionPlanLimitResponse:
      type: object
      properties:
        id:
          type: integer
        plan_id:
          type: integer
        period:
          type: string
        quota:
          type: integer
        unit:
          type: string
        enabled:
          type: boolean
        window_strategy:
          type: string
        created_at:
          type: integer
        updated_at:
          type: integer

    # ==================== Subscription Schemas ====================
    SubscriptionResponse:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        plan_id:
          type: integer
        order_id:
          type: integer
          nullable: true
        status:
          type: string
          enum: [pending, active, expired, cancelled]
        start_at:
          type: integer
        end_at:
          type: integer
        priority:
