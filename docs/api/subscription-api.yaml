openapi: 3.0.3
info:
  title: New API - Subscription System API
  description: |
    订阅系统 API 文档，包含套餐管理、订阅管理、优惠券管理、兑换码等功能。

    ## 认证方式
    - Admin API: 需要 `Authorization: Bearer {admin_token}` 请求头
    - User API: 需要 `Authorization: Bearer {user_token}` 请求头

    ## 通用响应格式
    ```json
    {
      "success": true,
      "message": "操作成功",
      "data": {...}
    }
    ```

    ## 错误响应格式
    ```json
    {
      "success": false,
      "message": "错误描述"
    }
    ```
  version: 1.0.0
  contact:
    name: API Support
servers:
  - url: /api
    description: API Server

tags:
  - name: Admin - Subscription Plans
    description: 管理员套餐管理 API
  - name: Admin - Subscriptions
    description: 管理员订阅管理 API
  - name: Admin - Subscription Orders
    description: 管理员订单管理 API
  - name: Admin - Subscription Coupons
    description: 管理员优惠券管理 API
  - name: User - Subscriptions
    description: 用户订阅 API
  - name: User - Coupons
    description: 用户优惠券 API
  - name: User - Redemptions
    description: 用户兑换 API
  - name: User - Settings
    description: 用户设置 API
  - name: Public
    description: 公开 API

paths:
  # ==================== Admin - Subscription Plans ====================
  /admin/subscription-plans:
    get:
      tags:
        - Admin - Subscription Plans
      summary: 获取所有套餐列表
      description: 分页获取套餐列表，支持状态和计费周期筛选
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, active, archived]
          description: 套餐状态筛选
        - name: billing_cycle
          in: query
          schema:
            type: string
            enum: [monthly, yearly, custom]
          description: 计费周期筛选
        - name: min_price
          in: query
          schema:
            type: integer
            minimum: 0
          description: 最低价格筛选（分）
        - name: max_price
          in: query
          schema:
            type: integer
            minimum: 0
          description: 最高价格筛选（分）
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SubscriptionPlanResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Admin - Subscription Plans
      summary: 创建套餐
      description: 创建新的订阅套餐
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionPlanRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SubscriptionPlanResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/subscription-plans/{id}:
    get:
      tags:
        - Admin - Subscription Plans
      summary: 获取套餐详情
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SubscriptionPlanResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Admin - Subscription Plans
      summary: 更新套餐
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionPlanRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Admin - Subscription Plans
      summary: 删除套餐
      description: 只能删除草稿状态的套餐
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/subscription-plans/{id}/publish:
    post:
      tags:
        - Admin - Subscription Plans
      summary: 发布套餐
      description: 将草稿状态的套餐发布为激活状态
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: 发布成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /admin/subscription-plans/{id}/unpublish:
    post:
      tags:
        - Admin - Subscription Plans
      summary: 下架套餐
      description: 将激活状态的套餐下架为归档状态
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: 下架成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ==================== Admin - Subscriptions ====================
  /admin/subscriptions:
    get:
      tags:
        - Admin - Subscriptions
      summary: 获取所有订阅列表
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: query
          schema:
            type: integer
            minimum: 1
          description: 用户 ID 筛选
        - name: plan_id
          in: query
          schema:
            type: integer
            minimum: 1
          description: 套餐 ID 筛选
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, active, expired, cancelled]
          description: 订阅状态筛选
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SubscriptionResponse'

  /admin/subscriptions/{id}:
    get:
      tags:
        - Admin - Subscriptions
      summary: 获取订阅详情
      description: 获取订阅详情，包含使用量摘要和历史记录
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SubscriptionResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/subscriptions/{id}/cancel:
    post:
      tags:
        - Admin - Subscriptions
      summary: 取消订阅
      description: 管理员取消用户订阅，只能取消 active 或 pending 状态的订阅
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  maxLength: 500
                  description: 取消原因
      responses:
        '200':
          description: 取消成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /admin/subscriptions/{id}/refund:
    post:
      tags:
        - Admin - Subscriptions
      summary: 退款订阅
      description: |
        管理员为订阅创建退款记录。

        **注意**: 此 API 仅记录退款流水，不实际增加用户余额。实际退款需线下处理。

        退款记录会写入 user_bills 表，Amount=0（避免污染统计），FinalAmount 记录退款金额。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - reason
              properties:
                amount:
                  type: integer
                  minimum: 1
                  description: 退款金额（分）
                reason:
                  type: string
                  maxLength: 500
                  description: 退款原因
                refund_type:
                  type: string
                  enum: [manual, auto]
                  default: manual
                  description: 退款类型
      responses:
        '200':
          description: 退款记录创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "退款已记录，实际退款请走线下处理"
        '400':
          $ref: '#/components/responses/BadRequest'

  /admin/subscriptions/{id}/priority:
    put:
      tags:
        - Admin - Subscriptions
      summary: 更新订阅优先级
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - priority
              properties:
                priority:
                  type: integer
                  minimum: 0
                  description: 优先级（数字越小优先级越高）
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /admin/subscriptions/{id}/activate:
    post:
      tags:
        - Admin - Subscriptions
      summary: 激活订阅
      description: 将 pending 状态的订阅激活
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: 激活成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /admin/subscriptions/{id}/expire:
    post:
      tags:
        - Admin - Subscriptions
      summary: 强制过期订阅
      description: 将订阅强制设置为过期状态
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: 过期成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ==================== Admin - Subscription Orders ====================
  /admin/subscription-orders:
    get:
      tags:
        - Admin - Subscription Orders
      summary: 获取所有订单列表
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: plan_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, paid, cancelled, expired, failed]
        - name: payment_channel
          in: query
          schema:
            type: string
        - name: start_time
          in: query
          schema:
            type: integer
          description: 开始时间戳
        - name: end_time
          in: query
          schema:
            type: integer
          description: 结束时间戳
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SubscriptionOrderResponse'

  /admin/subscription-orders/{id}:
    get:
      tags:
        - Admin - Subscription Orders
      summary: 获取订单详情
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SubscriptionOrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/subscription-orders/{id}/refund:
    post:
      tags:
        - Admin - Subscription Orders
      summary: 退款订单
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: 退款成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /admin/subscription-orders/{id}/cancel:
    post:
      tags:
        - Admin - Subscription Orders
      summary: 取消订单
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: 取消成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # ==================== Admin - Subscription Coupons ====================
  /admin/subscription-coupons:
    get:
      tags:
        - Admin - Subscription Coupons
      summary: 获取所有优惠券列表
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, expired]
        - name: scope
          in: query
          schema:
            type: string
            enum: [wallet, subscription, wallet_subscription]
        - name: type
          in: query
          schema:
            type: string
            enum: [discount, full_reduction, instant_reduction]
        - name: keyword
          in: query
          schema:
            type: string
          description: 搜索关键词（code/name）
        - name: bind_user_id
          in: query
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CouponResponse'

    post:
      tags:
        - Admin - Subscription Coupons
      summary: 创建优惠券
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponCreateRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CouponResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /admin/subscription-coupons/{id}:
    get:
      tags:
        - Admin - Subscription Coupons
      summary: 获取优惠券详情
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CouponResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Admin - Subscription Coupons
      summary: 更新优惠券
      description: 部分更新（PATCH 语义），只更新提供的字段。code 不可修改，total_count 只能增加。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponUpdateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

    delete:
      tags:
        - Admin - Subscription Coupons
      summary: 删除优惠券
      description: 只能删除未使用的优惠券
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /admin/subscription-coupons/{id}/bind-redemption:
    post:
      tags:
        - Admin - Subscription Coupons
      summary: 绑定优惠券到兑换码
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponBindRequest'
      responses:
        '200':
          description: 绑定成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /admin/subscription-coupons/{id}/unbind:
    delete:
      tags:
        - Admin - Subscription Coupons
      summary: 解绑优惠券
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: 解绑成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /admin/subscription-coupons/{id}/bindings:
    get:
      tags:
        - Admin - Subscription Coupons
      summary: 获取优惠券绑定列表
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # ==================== Public ====================
  /subscription-plans:
    get:
      tags:
        - Public
      summary: 获取可用套餐列表
      description: 获取状态为 active 的公开套餐列表（无需认证）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SubscriptionPlanResponse'

  # ==================== User - Subscriptions (New Paths - Recommended) ====================
  /user/subscriptions:
    get:
      tags:
        - User - Subscriptions
      summary: 获取当前用户的订阅列表
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SubscriptionResponse'

  /user/subscriptions/active:
    get:
      tags:
        - User - Subscriptions
      summary: 获取当前用户的活跃订阅
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SubscriptionResponse'

  /user/subscriptions/{id}:
    get:
      tags:
        - User - Subscriptions
      summary: 获取订阅详情
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SubscriptionResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /user/subscriptions/{id}/usage:
    get:
      tags:
        - User - Subscriptions
      summary: 获取订阅使用量
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SubscriptionUsageResponse'

  /user/subscriptions/{id}/history:
    get:
      tags:
        - User - Subscriptions
      summary: 获取订阅历史记录
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object

  /user/subscriptions/{id}/settings:
    put:
      tags:
        - User - Subscriptions
      summary: 更新订阅设置
      security:
