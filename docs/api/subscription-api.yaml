            $ref: '#/components/schemas/SubscriptionUsagePeriodSummary'

    # ==================== Subscription Order Schemas ====================
    SubscriptionOrderResponse:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        plan_id:
          type: integer
        plan_snapshot:
          type: string
        coupon_id:
          type: integer
          nullable: true
        coupon_snapshot:
          type: string
        payment_channel:
          type: string
        price_cents:
          type: integer
        discount_cents:
          type: integer
        final_price_cents:
          type: integer
        redemption_id:
          type: integer
          nullable: true
        bill_id:
          type: integer
          nullable: true
        status:
          type: string
          enum: [pending, paid, cancelled, expired, failed]
        metadata:
          type: string
        created_at:
          type: integer
        updated_at:
          type: integer

    # ==================== Coupon Schemas ====================
    CouponCreateRequest:
      type: object
      required:
        - code
        - name
        - type
        - scope
        - discount_value
        - currency
        - total_count
        - per_user_limit
        - valid_from
        - valid_to
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: 领取码（格式：COUPON + YYYYMMDD + 6位随机）
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
        type:
          type: string
          enum: [discount, full_reduction, instant_reduction]
          description: |
            优惠券类型：
            - discount: 折扣券（百分比）
            - full_reduction: 满减券
            - instant_reduction: 立减券
        scope:
          type: string
          enum: [wallet, subscription, wallet_subscription]
          description: |
            适用范围：
            - wallet: 余额充值
            - subscription: 订阅
            - wallet_subscription: 充值+订阅均可
        discount_value:
          type: integer
          minimum: 1
          description: 折扣值（百分比1-100或金额分）
        threshold_amount:
          type: integer
          minimum: 0
          description: 满减阈值（分）
        currency:
          type: string
          enum: [CNY]
        applicable_plan_ids:
          type: array
          items:
            type: integer
          description: 适用套餐 ID 列表（空表示全部）
        total_count:
          type: integer
          minimum: 1
          description: 总发行量
        per_user_limit:
          type: integer
          minimum: 1
          description: 每用户限领数量
        valid_from:
          type: integer
          description: 有效期开始时间戳
        valid_to:
          type: integer
          description: 有效期结束时间戳
        status:
          type: string
          enum: [active, inactive, expired]
          default: active
        bind_user_id:
          type: integer
          minimum: 1
          description: 专属用户 ID

    CouponUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
        type:
          type: string
          enum: [discount, full_reduction, instant_reduction]
        scope:
          type: string
          enum: [wallet, subscription, wallet_subscription]
        discount_value:
          type: integer
          minimum: 1
        threshold_amount:
          type: integer
          minimum: 0
        currency:
          type: string
          enum: [CNY]
        applicable_plan_ids:
          type: array
          items:
            type: integer
        total_count:
          type: integer
          minimum: 1
          description: 只能增加不能减少
        per_user_limit:
          type: integer
          minimum: 1
        valid_from:
          type: integer
        valid_to:
          type: integer
        status:
          type: string
          enum: [active, inactive, expired]
        bind_user_id:
          type: integer
          minimum: 1

    CouponResponse:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        description:
          type: string
        type:
          type: string
        scope:
          type: string
        discount_value:
          type: integer
        threshold_amount:
          type: integer
        currency:
          type: string
        applicable_plan_ids:
          type: array
          items:
            type: integer
        total_count:
          type: integer
        used_count:
          type: integer
        per_user_limit:
          type: integer
        valid_from:
          type: integer
        valid_to:
          type: integer
        status:
          type: string
        bind_user_id:
          type: integer
          nullable: true
        created_by:
          type: integer
        created_at:
          type: integer
        updated_at:
          type: integer
        is_available:
          type: boolean
        remaining_count:
          type: integer

    CouponBindRequest:
      type: object
      required:
        - redemption_id
      properties:
        redemption_id:
          type: integer
          minimum: 1
          description: 兑换码 ID
        bound_user_id:
          type: integer
          minimum: 1
          description: 绑定专属用户 ID（可选）

    UserCouponResponse:
      type: object
      description: 用户已领取的优惠券（扁平结构，包含券模板信息）
      properties:
        id:
          type: integer
          description: 用户优惠券记录 ID
        coupon_id:
          type: integer
          description: 优惠券模板 ID
        code:
          type: string
          description: 优惠券码
        status:
          type: string
          enum: [available, used, expired, locked, invalid]
          description: |
            券状态：
            - available: 可用
            - used: 已使用
            - expired: 已过期
            - locked: 锁定中（支付中）
            - invalid: 无效
        claimed_at:
          type: integer
          description: 领取时间戳
        used_at:
          type: integer
          nullable: true
          description: 使用时间戳
        order_id:
          type: integer
          nullable: true
          description: 关联订单 ID
        discount_amount:
          type: integer
          description: 优惠金额（分）
        final_amount:
          type: integer
          description: 最终金额（分）
        created_at:
          type: integer
          description: 创建时间戳
        # 优惠券模板详情（扁平展开）
        coupon_name:
          type: string
          description: 优惠券名称
        coupon_type:
          type: string
          enum: [discount, full_reduction, instant_reduction]
          description: 优惠券类型
        coupon_scope:
          type: string
          enum: [wallet, subscription, wallet_subscription]
          description: 适用范围
        discount_value:
          type: integer
          description: 折扣值
        threshold_amount:
          type: integer
          description: 满减阈值（分）
        currency:
          type: string
          description: 货币类型
        valid_from:
          type: integer
          description: 有效期开始时间戳
        valid_to:
          type: integer
          description: 有效期结束时间戳
        remaining_days:
          type: integer
          description: 剩余有效天数
        can_use:
          type: boolean
          description: 当前是否可使用

    AvailableCouponResponse:
      type: object
      description: 可领取的优惠券模板
      properties:
        id:
          type: integer
          description: 优惠券模板 ID
        code:
          type: string
          description: 优惠券码
        name:
          type: string
          description: 优惠券名称
        description:
          type: string
          description: 优惠券描述
        type:
          type: string
          enum: [discount, full_reduction, instant_reduction]
          description: 优惠券类型
        scope:
          type: string
          enum: [wallet, subscription, wallet_subscription]
          description: 适用范围
        discount_value:
          type: integer
          description: 折扣值
        threshold_amount:
          type: integer
          description: 满减阈值（分）
        currency:
          type: string
          description: 货币类型
        valid_from:
          type: integer
          description: 有效期开始时间戳
        valid_to:
          type: integer
          description: 有效期结束时间戳
        remaining_count:
          type: integer
          description: 剩余可领取数量
        remaining_days:
          type: integer
          description: 剩余有效天数

    CouponPreviewRequest:
      type: object
      required:
        - user_coupon_id
        - order_amount
        - scene
      properties:
        user_coupon_id:
          type: integer
          minimum: 1
          description: 用户优惠券 ID
        order_amount:
          type: integer
          minimum: 1
          description: 订单金额（分）
        scene:
          type: string
          enum: [wallet, subscription]
          description: 使用场景
        plan_id:
          type: integer
          description: 套餐 ID（subscription 场景时可选）
        currency:
          type: string
          description: 货币类型

    CouponPreviewResponse:
      type: object
      properties:
        valid:
          type: boolean
          description: 优惠券是否可用
        error_code:
          type: string
          description: 错误码（无效时）
        error_message:
          type: string
          description: 错误消息（无效时）
        original_amount:
          type: integer
          description: 原始金额（分）
        discount_amount:
          type: integer
          description: 优惠金额（分）
        final_amount:
          type: integer
          description: 最终金额（分）
        coupon_type:
          type: string
          description: 优惠券类型
        threshold_met:
          type: boolean
          description: 是否满足满减阈值

    # ==================== User Settings Schemas ====================
    AutoWalletFallbackResponse:
      type: object
      description: 用户自动钱包兜底配置响应
      properties:
        user_setting:
          type: boolean
          nullable: true
          description: 用户设置的值（数据库中的值，null 表示未设置）
        system_default:
          type: boolean
          description: 系统默认值
        effective:
          type: boolean
          description: 当前生效的值
        is_explicit:
          type: boolean
          description: 是否为用户显式设置（false 表示使用系统默认）
        using_system_default:
          type: boolean
          description: 是否正在使用系统默认值

    UpdateAutoWalletFallbackRequest:
      type: object
      description: |
        更新自动钱包兜底请求。
        enabled 和 reset 不能同时提供，必须提供其中一个。
      properties:
        enabled:
          type: boolean
          description: 开关状态（显式设置）
        reset:
          type: boolean
          description: 是否重置为继承系统默认（设为 true 时清除用户设置）

    AutoWalletFallbackUpdateResponse:
      type: object
      description: 更新后的自动钱包兜底状态
      properties:
        auto_wallet_fallback:
          type: boolean
          description: 当前生效的值
        is_explicit:
          type: boolean
          description: 是否为用户显式设置
        using_system_default:
          type: boolean
          description: 是否正在使用系统默认值

    # ==================== Redemption Schemas ====================
    UseRedemptionRequest:
      type: object
      required:
        - redemption_code
      properties:
        redemption_code:
          type: string
          description: 兑换码
        redeem_option:
          type: string
          enum: [stack, coexist, convert, replace, extend]
          description: |
            兑换选项（可选，存在订阅冲突时需要指定）：
            - stack: 叠加到现有订阅（同套餐）
            - coexist: 共存（保留旧订阅，创建新订阅）
            - convert: 转换（旧订阅折算到新订阅）
            - replace: 替换（取消旧订阅，创建新订阅）
            - extend: 延长（同套餐延长有效期）

    UseRedemptionResponse:
      type: object
      description: 兑换响应（顶层字段，非 data 包裹）
      properties:
        success:
          type: boolean
          description: 兑换是否成功
        subscription_id:
          type: integer
          description: 订阅 ID（成功时）
        redeem_option:
          type: string
          description: 实际使用的兑换选项
        extended_days:
          type: integer
          description: 延长天数（stack/extend 场景）
        new_end_at:
          type: integer
          description: 新结束时间戳
        coupon_used:
          type: boolean
          description: 是否使用了优惠券
        discount_amount:
          type: integer
          description: 优惠金额（分）
        idempotent:
          type: boolean
          description: 幂等标识（重复请求时为 true）
        conversion_info:
          $ref: '#/components/schemas/ConversionInfoResponse'
        conflict:
          $ref: '#/components/schemas/ConflictCheckResponse'
        error_code:
          type: string
          description: 错误码（失败时）
        message:
          type: string
          description: 消息

    ConversionInfoResponse:
      type: object
      description: 折算信息（convert 场景）
      properties:
        old_subscription_id:
          type: integer
        old_plan_id:
          type: integer
        old_remaining_days:
          type: integer
        old_daily_price:
          type: number
          format: float
          description: 旧套餐日均价（元）
        old_remaining_value:
          type: number
          format: float
          description: 旧套餐剩余价值（元）
        new_plan_id:
          type: integer
        new_daily_price:
          type: number
          format: float
          description: 新套餐日均价（元）
        converted_days:
          type: integer
          description: 折算天数
        remainder_amount:
          type: number
          format: float
          description: 不足一天的金额（元）
        new_subscription_end_at:
          type: integer
          description: 新订阅结束时间戳

    ConflictCheckResponse:
      type: object
      description: 冲突检测响应
      properties:
        has_conflict:
          type: boolean
          description: 是否存在冲突
        conflict_type:
          type: string
          enum: [same_plan, more_expensive, different_plan]
          description: 冲突类型
        existing_plan_id:
          type: integer
        existing_plan_name:
          type: string
        existing_plan_price:
          type: number
          format: float
          description: 现有套餐价格（元）
        new_plan_id:
          type: integer
        new_plan_name:
          type: string
        new_plan_price:
          type: number
          format: float
          description: 新套餐价格（元）
        available_options:
          type: array
          items:
            type: string
          description: 可用的处理选项
        recommended_option:
          type: string
          description: 推荐的处理选项
        conversion_preview:
          $ref: '#/components/schemas/ConversionPreviewResponse'

    ConversionPreviewResponse:
      type: object
      description: 折算预览
      properties:
        remaining_days:
          type: integer
        remaining_value:
          type: number
          format: float
          description: 剩余价值（元）
        converted_days:
          type: integer
        remainder_amount:
          type: number
          format: float
          description: 不足一天的金额（元）
        new_end_at:
          type: integer

    # 保留旧 Schema 以兼容（标记废弃）
    RedemptionSubscriptionRequest:
      type: object
      deprecated: true
      description: "已废弃，请使用 UseRedemptionRequest"
      required:
        - redemption_code
      properties:
        redemption_code:
          type: string
          description: 兑换码
        redeem_option:
          type: string
          enum: [stack, coexist, convert, replace, extend]
          description: 兑换选项（可选）

    RedemptionSubscriptionResponse:
      type: object
      deprecated: true
      description: "已废弃，请使用 UseRedemptionResponse"
      properties:
        subscription_id:
          type: integer
        message:
          type: string
